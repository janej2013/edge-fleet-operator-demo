---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: edgedevices.edge.example.com
spec:
  group: edge.example.com
  names:
    kind: EdgeDevice
    listKind: EdgeDeviceList
    plural: edgedevices
    singular: edgedevice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.desiredFirmwareVersion
      name: Desired
      type: string
    - jsonPath: .status.currentFirmwareVersion
      name: Current
      type: string
    - jsonPath: .status.activeSlot
      name: Slot
      type: string
    - jsonPath: .spec.rolloutPaused
      name: Paused
      type: boolean
    - jsonPath: .status.lastHeartbeat
      name: Heartbeat
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: EdgeDevice is the Schema for the edgedevices API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of EdgeDevice
            properties:
              checksumSHA256:
                description: |-
                  checksumSHA256 is the expected digest of the firmware image. The agent
                  refuses to flash anything that does not match (brick safety).
                pattern: ^[a-f0-9]{64}$
                type: string
              desiredFirmwareVersion:
                description: desiredFirmwareVersion is the firmware the device should
                  converge to.
                minLength: 1
                type: string
              deviceLabels:
                additionalProperties:
                  type: string
                description: |-
                  deviceLabels are opaque config key/values pushed to the device
                  (kept separate from metadata.labels, which belong to K8s tooling).
                type: object
              firmwareURL:
                description: firmwareURL is where the agent downloads the firmware
                  image from.
                pattern: ^https?://
                type: string
              region:
                description: region is a placement/config fragment used by rollout
                  ordering.
                type: string
              rolloutPaused:
                description: |-
                  rolloutPaused freezes upgrades for this device. The agent must not
                  start a new firmware transaction while true; an in-flight transaction
                  is allowed to finish (pausing mid-flash is how you brick hardware).
                type: boolean
            required:
            - checksumSHA256
            - desiredFirmwareVersion
            - firmwareURL
            type: object
          status:
            description: status defines the observed state of EdgeDevice
            properties:
              activeSlot:
                description: activeSlot is the A/B partition currently booted ("A"
                  or "B").
                type: string
              conditions:
                description: conditions carry the fine-grained "why" behind phase
                  transitions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentFirmwareVersion:
                description: currentFirmwareVersion is what the device is actually
                  running.
                type: string
              lastHeartbeat:
                description: |-
                  lastHeartbeat is the last time the agent reported in. The operator
                  compares this against a timeout to flip the device to Degraded.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the metadata.generation the agent last acted on.
                  It answers "is this Status about the *current* Spec, or a stale one?" —
                  generation bumps only on Spec changes, so a consumer can tell whether
                  the device has even seen the latest intent yet.
                format: int64
                type: integer
              phase:
                description: phase is the coarse lifecycle summary; details live in
                  conditions.
                enum:
                - Provisioning
                - Ready
                - Upgrading
                - Degraded
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
