# This rule is not used by the project edge-fleet-operator-demo itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the edge.example.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: edge-fleet-operator-demo
    app.kubernetes.io/managed-by: kustomize
  name: edgedevice-editor-role
rules:
- apiGroups:
  - edge.example.com
  resources:
  - edgedevices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - edge.example.com
  resources:
  - edgedevices/status
  verbs:
  - get
